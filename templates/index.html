<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix IMDb Recommendations</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --netflix-red: #e50914;
            --netflix-black: #141414;
            --dark-gray: #2f2f2f;
            --light-gray: #808080;
            --white: #ffffff;
            --success: #46d369;
            --warning: #f9a825;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--netflix-black);
            color: var(--white);
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        header {
            background: linear-gradient(to right, var(--netflix-red), #b20710);
            padding: 20px 0;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        header h1 {
            text-align: center;
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* Stats Bar */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--dark-gray);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .stat-card h3 {
            color: var(--light-gray);
            font-size: 0.9rem;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .stat-card p {
            font-size: 2rem;
            font-weight: bold;
            color: var(--netflix-red);
        }

        /* Main Layout */
        .main-layout {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 30px;
        }

        /* Sidebar Filters */
        .sidebar {
            background: var(--dark-gray);
            padding: 25px;
            border-radius: 8px;
            height: fit-content;
            position: sticky;
            top: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .sidebar h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: var(--netflix-red);
        }

        .filter-group {
            margin-bottom: 25px;
        }

        .filter-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--light-gray);
            font-size: 0.9rem;
            font-weight: 600;
        }

        .filter-group input,
        .filter-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 4px;
            background: var(--netflix-black);
            color: var(--white);
            font-size: 1rem;
        }

        .filter-group input:focus,
        .filter-group select:focus {
            outline: none;
            border-color: var(--netflix-red);
        }

        .rating-range {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .rating-range input {
            width: 80px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: var(--netflix-red);
            color: var(--white);
        }

        .btn-primary:hover {
            background: #f40612;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(229, 9, 20, 0.4);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--light-gray);
            color: var(--white);
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.1);
        }

        /* Movies Grid */
        .movies-section {
            background: var(--dark-gray);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .movies-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .movies-header h2 {
            font-size: 1.5rem;
            color: var(--netflix-red);
        }

        .movies-count {
            color: var(--light-gray);
            font-size: 1rem;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        /* Movie Card */
        .movie-card {
            background: var(--netflix-black);
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .movie-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(229, 9, 20, 0.3);
        }

        .movie-poster {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: linear-gradient(135deg, #1a1a1a 0%, #2f2f2f 100%);
        }

        .movie-info {
            padding: 15px;
        }

        .movie-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--white);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .movie-meta {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .rating-badge {
            background: var(--success);
            color: var(--netflix-black);
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .rating-badge.high {
            background: var(--success);
        }

        .rating-badge.medium {
            background: var(--warning);
        }

        .year-badge {
            background: #444;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .movie-genres {
            font-size: 0.85rem;
            color: var(--light-gray);
            margin-bottom: 10px;
        }

        .movie-categories {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 12px;
        }

        .category-tag {
            background: rgba(229, 9, 20, 0.2);
            border: 1px solid var(--netflix-red);
            color: var(--netflix-red);
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 0.75rem;
        }

        .movie-plot {
            font-size: 0.9rem;
            color: var(--light-gray);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .movie-actions {
            display: flex;
            gap: 10px;
        }

        .btn-watched {
            flex: 1;
            padding: 8px;
            border: 1px solid var(--success);
            background: transparent;
            color: var(--success);
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .btn-watched:hover {
            background: var(--success);
            color: var(--netflix-black);
        }

        .btn-watched.watched {
            background: var(--success);
            color: var(--netflix-black);
        }

        .btn-netflix {
            flex: 1;
            padding: 8px;
            border: none;
            background: var(--netflix-red);
            color: var(--white);
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
            text-decoration: none;
            text-align: center;
        }

        .btn-netflix:hover {
            background: #f40612;
        }

        /* Loading Spinner */
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2rem;
            color: var(--light-gray);
        }

        .spinner {
            border: 4px solid rgba(229, 9, 20, 0.1);
            border-top: 4px solid var(--netflix-red);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 50px;
            color: var(--light-gray);
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .main-layout {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: static;
            }
        }

        @media (max-width: 768px) {
            .movies-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }

            header h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>🎬 Netflix IMDb Recommendations</h1>
        </div>
    </header>

    <div class="container">
        <!-- Stats Bar -->
        <div class="stats-bar" id="statsBar">
            <div class="stat-card">
                <h3>Total Titles</h3>
                <p id="statTotal">0</p>
            </div>
            <div class="stat-card">
                <h3>Unwatched</h3>
                <p id="statUnwatched">0</p>
            </div>
            <div class="stat-card">
                <h3>Watched</h3>
                <p id="statWatched">0</p>
            </div>
            <div class="stat-card">
                <h3>Avg Rating</h3>
                <p id="statRating">0</p>
            </div>
        </div>

        <!-- Main Layout -->
        <div class="main-layout">
            <!-- Sidebar Filters -->
            <aside class="sidebar">
                <h2>🔍 Filters</h2>

                <div class="filter-group">
                    <label for="searchInput">Search</label>
                    <input type="text" id="searchInput" placeholder="Search titles...">
                </div>

                <div class="filter-group">
                    <label for="categorySelect">Category</label>
                    <select id="categorySelect">
                        <option value="all">All Categories</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="genreSelect">Genre</label>
                    <select id="genreSelect">
                        <option value="all">All Genres</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>IMDb Rating</label>
                    <div class="rating-range">
                        <input type="number" id="minRating" min="0" max="10" step="0.1" value="0" placeholder="Min">
                        <span>to</span>
                        <input type="number" id="maxRating" min="0" max="10" step="0.1" value="10" placeholder="Max">
                    </div>
                </div>

                <div class="filter-group">
                    <label for="watchedFilter">Watched Status</label>
                    <select id="watchedFilter">
                        <option value="all">All</option>
                        <option value="unwatched" selected>Unwatched Only</option>
                        <option value="watched">Watched Only</option>
                    </select>
                </div>

                <button class="btn btn-primary" onclick="applyFilters()">Apply Filters</button>
                <button class="btn btn-secondary" onclick="resetFilters()">Reset</button>
            </aside>

            <!-- Movies Section -->
            <section class="movies-section">
                <div class="movies-header">
                    <h2>Recommendations</h2>
                    <span class="movies-count" id="moviesCount">Loading...</span>
                </div>

                <div id="moviesContainer">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Loading recommendations...</p>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script>
        let allMovies = [];
        let filteredMovies = [];

        // Load initial data
        async function loadData() {
            try {
                // Load stats
                const statsResponse = await fetch('/api/stats');
                const stats = await statsResponse.json();
                updateStats(stats);

                // Load categories
                const categoriesResponse = await fetch('/api/categories');
                const categories = await categoriesResponse.json();
                populateCategories(categories);

                // Load genres
                const genresResponse = await fetch('/api/genres');
                const genres = await genresResponse.json();
                populateGenres(genres);

                // Load movies
                await loadMovies();
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('moviesContainer').innerHTML = `
                    <div class="empty-state">
                        <h3>Error Loading Data</h3>
                        <p>Please make sure the enrichment script has been run.</p>
                    </div>
                `;
            }
        }

        function updateStats(stats) {
            document.getElementById('statTotal').textContent = stats.total;
            document.getElementById('statUnwatched').textContent = stats.unwatched;
            document.getElementById('statWatched').textContent = stats.watched;
            document.getElementById('statRating').textContent = stats.avg_rating;
        }

        function populateCategories(categories) {
            const select = document.getElementById('categorySelect');
            categories.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = cat;
                select.appendChild(option);
            });
        }

        function populateGenres(genres) {
            const select = document.getElementById('genreSelect');
            genres.forEach(genre => {
                const option = document.createElement('option');
                option.value = genre;
                option.textContent = genre;
                select.appendChild(option);
            });
        }

        async function loadMovies() {
            const searchParams = new URLSearchParams({
                category: document.getElementById('categorySelect').value,
                min_rating: document.getElementById('minRating').value,
                max_rating: document.getElementById('maxRating').value,
                search: document.getElementById('searchInput').value,
                genre: document.getElementById('genreSelect').value,
                watched: document.getElementById('watchedFilter').value
            });

            const response = await fetch(`/api/movies?${searchParams}`);
            const data = await response.json();
            
            filteredMovies = data.movies;
            displayMovies(filteredMovies);
            document.getElementById('moviesCount').textContent = `${data.total} titles`;
        }

        function displayMovies(movies) {
            const container = document.getElementById('moviesContainer');

            if (movies.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No movies found</h3>
                        <p>Try adjusting your filters</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="movies-grid">
                    ${movies.map(movie => createMovieCard(movie)).join('')}
                </div>
            `;
        }

        function createMovieCard(movie) {
            const rating = parseFloat(movie.imdb_rating || 0);
            const ratingClass = rating >= 8 ? 'high' : 'medium';
            const watchedClass = movie.watched ? 'watched' : '';
            const watchedText = movie.watched ? '✓ Watched' : 'Mark Watched';

            const categories = movie.categories || [];
            const categoryTags = categories.slice(0, 2).map(cat => 
                `<span class="category-tag">${cat}</span>`
            ).join('');

            return `
                <div class="movie-card">
                    <img src="${movie.image || 'https://via.placeholder.com/280x200?text=No+Image'}" 
                         alt="${movie.title}" 
                         class="movie-poster"
                         onerror="this.src='https://via.placeholder.com/280x200?text=No+Image'">
                    <div class="movie-info">
                        <h3 class="movie-title">${movie.title}</h3>
                        <div class="movie-meta">
                            <span class="rating-badge ${ratingClass}">⭐ ${movie.imdb_rating}</span>
                            <span class="year-badge">${movie.year || 'N/A'}</span>
                        </div>
                        <div class="movie-genres">${movie.genres || 'N/A'}</div>
                        <div class="movie-categories">${categoryTags}</div>
                        <p class="movie-plot">${movie.plot || 'No plot available'}</p>
                        <div class="movie-actions">
                            <button class="btn-watched ${watchedClass}" 
                                    onclick="toggleWatched('${movie.netflixId}', ${!movie.watched})">
                                ${watchedText}
                            </button>
                            <a href="${movie.link}" target="_blank" class="btn-netflix">
                                Watch on Netflix
                            </a>
                        </div>
                    </div>
                </div>
            `;
        }

        async function toggleWatched(netflixId, watched) {
            try {
                const response = await fetch(`/api/movie/${netflixId}/watched`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ watched })
                });

                if (response.ok) {
                    // Reload movies to reflect changes
                    await loadMovies();
                    // Reload stats
                    const statsResponse = await fetch('/api/stats');
                    const stats = await statsResponse.json();
                    updateStats(stats);
                }
            } catch (error) {
                console.error('Error updating watched status:', error);
            }
        }

        function applyFilters() {
            loadMovies();
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('categorySelect').value = 'all';
            document.getElementById('genreSelect').value = 'all';
            document.getElementById('minRating').value = '0';
            document.getElementById('maxRating').value = '10';
            document.getElementById('watchedFilter').value = 'unwatched';
            loadMovies();
        }

        // Add enter key support for search
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                applyFilters();
            }
        });

        // Load data on page load
        loadData();
    </script>
</body>
</html>
